<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="PP-MD icon">
  <!-- Document shape with rounded corners -->
  <rect fill="currentColor" x="10" y="6" width="44" height="52" rx="3"/>
  <!-- Top accent bar cutout -->
  <rect fill="white" x="10" y="6" width="44" height="10"/>
  <!-- P letter in top left -->
  <rect fill="white" x="14" y="8" width="4" height="6"/>
  <rect fill="white" x="14" y="11" width="8" height="3"/>
  <!-- M letter (middle top) -->
  <rect fill="white" x="24" y="8" width="4" height="6"/>
  <rect fill="white" x="28" y="8" width="2" height="6"/>
  <rect fill="white" x="30" y="8" width="4" height="6"/>
  <!-- D letter in top right -->
  <rect fill="white" x="38" y="8" width="4" height="6"/>
  <rect fill="white" x="42" y="8" width="4" height="6" rx="2"/>
  <!-- Content lines -->
  <rect fill="white" x="12" y="20" width="40" height="2" rx="1"/>
  <rect fill="white" x="12" y="26" width="40" height="2" rx="1"/>
  <rect fill="white" x="12" y="32" width="32" height="2" rx="1"/>
  <rect fill="white" x="12" y="38" width="40" height="2" rx="1"/>
  <rect fill="white" x="12" y="44" width="24" height="2" rx="1"/>
</svg>
